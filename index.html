<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#000;--bg2:#0e0c08;--gold:#c9a24b;--gold2:#e6c97a;--ink:#f3ead7;--mute:#a89c82;--line:#2b2417;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

/* Cabeçalho interativo */
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px clamp(16px,5vw,56px);padding-top:max(8px,env(safe-area-inset-top,0px));transition:padding .3s}
header img{height:64px;width:64px;display:block;transition:height .3s,width .3s}
header.min{padding-top:max(2px,env(safe-area-inset-top,0px));padding-bottom:2px}
header.min img{height:44px;width:44px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
nav{display:flex;gap:clamp(14px,3vw,34px);font-size:15px}
nav a{color:var(--mute);padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a:hover,nav a.on{color:var(--gold2);border-color:var(--gold)}
#mb{display:none;background:none;border:1px solid var(--line);border-radius:4px;width:44px;height:44px;cursor:pointer;position:relative}
#mb span,#mb span::before,#mb span::after{position:absolute;left:11px;width:20px;height:2px;background:var(--gold2);content:"";transition:transform .25s,opacity .25s}
#mb span{top:20px}#mb span::before{top:-7px;left:0}#mb span::after{top:7px;left:0}
#mb[aria-expanded=true] span{background:transparent}
#mb[aria-expanded=true] span::before{transform:translateY(7px) rotate(45deg)}
#mb[aria-expanded=true] span::after{transform:translateY(-7px) rotate(-45deg)}

/* Hero */
.herowrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 75% 40%,#1c1608 0%,#000 65%)}
#sp{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero{position:relative;padding:clamp(56px,9vw,110px) clamp(16px,5vw,56px) clamp(48px,7vw,90px);max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(44px,7.5vw,92px);color:var(--gold2)}
.hero h1 em{display:block;font-style:italic;color:var(--ink);transition:opacity .4s,transform .4s}
.hero h1 em.out{opacity:0;transform:translateY(10px)}
.hero p{max-width:46ch;font-size:18px;color:var(--mute);margin:24px 0 32px}
.heroart{perspective:700px;justify-self:center;width:min(100%,320px)}
.heroart svg{width:100%;height:auto;display:block;transition:transform .15s;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(201,162,75,.25))}
@keyframes fl{50%{translate:0 -12px}}
.btn{display:inline-block;background:var(--gold);color:#000;font-weight:500;padding:14px 28px;border-radius:2px;border:0;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold);margin-left:10px}
.btn.ghost:hover{background:var(--gold);color:#000}

section{padding:clamp(40px,7vw,80px) clamp(16px,5vw,56px);max-width:1200px;margin:0 auto}
section h2{font-size:clamp(32px,5vw,52px);color:var(--gold2)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 36px;align-items:center}
.chip{background:none;color:var(--mute);border:1px solid var(--line);padding:8px 18px;border-radius:99px;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip[aria-pressed=true]{background:var(--gold);color:#000;border-color:var(--gold)}
#q{margin-left:auto;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:99px;font:inherit;font-size:14px;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:12px}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
.ph{aspect-ratio:4/5;width:100%;padding:0;cursor:pointer;background:radial-gradient(circle at 50% 35%,#1d1709,#0a0805);border:1px solid var(--line);position:relative;display:block;overflow:hidden;transition:border-color .3s}
.ph:hover{border-color:var(--gold)}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ph:hover img,.ph:hover svg{transform:scale(1.05)}
.badge{position:absolute;top:10px;left:10px;z-index:1;background:var(--gold);color:#000;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500}
.badge.off{background:#3a3326;color:var(--ink)}
.card.off .ph img,.card.off .ph svg{opacity:.55}
.card h3{font-size:24px;cursor:pointer}
.card .cat{color:var(--mute);font-size:14px;margin-top:-8px}
.card .pr{color:var(--gold2);font-family:"Cormorant Garamond",serif;font-size:21px}
.card a.ask{font-size:14px;color:var(--gold);border-bottom:1px solid var(--gold);align-self:flex-start;padding-bottom:1px}
.empty{color:var(--mute);padding:40px 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);border-top:1px solid var(--line)}
.about p{color:var(--mute);max-width:52ch;white-space:pre-line}
footer{border-top:1px solid var(--line);text-align:center;padding:40px 16px 96px;color:var(--mute);font-size:14px}
footer img{height:110px;width:110px;margin-bottom:8px}
footer .lk{background:none;border:0;color:#6d634e;cursor:pointer;font-size:13px;margin-top:14px;text-decoration:underline}
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1faa59;color:#fff;padding:13px 22px;border-radius:99px;font-weight:500;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.6);z-index:6}

/* Janelas */
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--gold);padding:0;width:min(940px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
.x{position:absolute;top:8px;right:8px;background:none;border:0;font-size:30px;line-height:1;color:var(--gold2);cursor:pointer;width:44px;height:44px;z-index:2}
.pm{display:grid;grid-template-columns:1fr 1fr}
.pm .big{aspect-ratio:4/5;background:#0a0805}
.pm .big img,.pm .big svg{width:100%;height:100%;object-fit:cover;display:block}
.pm .info{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:14px;justify-content:center}
.pm h3{font-size:38px;color:var(--gold2)}
.pm .pr{font-family:"Cormorant Garamond",serif;font-size:28px}
.adm{padding:24px clamp(16px,3vw,32px) 32px}
.adm h3{font-size:30px;color:var(--gold2);margin-bottom:14px;padding-right:40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.adm input[type=text],.adm input[type=password],.adm input:not([type]),.adm textarea,.adm select{width:100%;background:#000;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:3px;font:inherit;font-size:15px}
.adm textarea{min-height:110px;resize:vertical}
.adm label{display:block;font-size:13px;color:var(--mute)}
.adm label.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.adm label.ck input{width:18px;height:18px;accent-color:var(--gold)}
.ar{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.at{aspect-ratio:4/5;background:#0a0805;border:1px solid var(--line);overflow:hidden}
.at img,.at svg{width:100%;height:100%;object-fit:cover;display:block}
.af{display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:10px}
.ab{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.sm{background:none;border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:99px;font-size:13px;cursor:pointer}
.sm:hover{border-color:var(--gold);color:var(--gold2)}
.sm.dg{color:#e08a7a}
.note{color:var(--mute);font-size:14px;max-width:62ch}
.stack{display:grid;gap:14px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{color:#e08a7a;min-height:1.4em;font-size:14px}

@media(max-width:700px){
  #mb{display:block}
  nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:#000;border-bottom:1px solid var(--line);padding:8px 24px 16px;font-size:17px}
  nav.open{display:flex}
  nav a{padding:12px 0}
  .about{grid-template-columns:1fr}
  #q{margin-left:0;width:100%}
  .hero{grid-template-columns:1fr}
  .heroart{display:none}
  .btn.ghost{margin:10px 0 0}
  .pm{grid-template-columns:1fr}
  .ar{grid-template-columns:70px 1fr}
  .af{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

function hash(s){var x=5381;for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)}
function wa(t){return "https://wa.me/"+D.cfg.whats+"?text="+encodeURIComponent(t)}

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rev===SEED.rev&&s.pecas){D=s;return}}catch(e){}
  D=JSON.parse(JSON.stringify(SEED));
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}
  catch(e){alert("O espaço do navegador encheu. Baixe o site atualizado na aba Publicar e use fotos menores ou menos fotos.")}
  render();
}

/* Ilustrações de joias (usadas quando a peça ainda não tem foto) */
function star(x,y,s){return '<path d="M'+x+' '+(y-s)+'Q'+x+' '+y+' '+(x+s)+' '+y+'Q'+x+' '+y+' '+x+' '+(y+s)+'Q'+x+' '+y+' '+(x-s)+' '+y+'Q'+x+' '+y+' '+x+' '+(y-s)+'Z" fill="#f3ead7" opacity=".85"/>'}
var G='stroke="url(#g)"';
function ART(c){
  var b="",k=(c||"").toLowerCase(),i,t,x,y,a;
  if(k.indexOf("anel")>-1||k.indexOf("anéis")>-1){
    b='<circle cx="100" cy="162" r="46" fill="none" '+G+' stroke-width="9"/><path d="M78 100L122 100L138 118L100 154L62 118Z" fill="#e6c97a" fill-opacity=".14" '+G+' stroke-width="3" stroke-linejoin="round"/><path d="M62 118H138M78 100L90 118L100 154L110 118L122 100M90 118L100 100L110 118" fill="none" '+G+' stroke-width="1.5"/>'+star(150,70,10)+star(52,86,7)}
  else if(k.indexOf("colar")>-1||k.indexOf("colares")>-1){
    b='<path d="M30 40Q100 220 170 40" fill="none" '+G+' stroke-width="3"/><path d="M100 132L115 150L100 174L85 150Z" fill="#e6c97a" fill-opacity=".16" '+G+' stroke-width="3" stroke-linejoin="round"/><path d="M85 150H115" '+G+' stroke-width="1.5"/>'+star(160,150,10)+star(44,168,7)}
  else if(k.indexOf("brinco")>-1){
    [68,132].forEach(function(cx){b+='<circle cx="'+cx+'" cy="140" r="34" fill="none" '+G+' stroke-width="7"/><circle cx="'+cx+'" cy="88" r="6" fill="#f3ead7" fill-opacity=".8" '+G+' stroke-width="2"/><path d="M'+cx+' 94V106" '+G+' stroke-width="3"/>'});
    b+=star(100,60,9)+star(100,205,8)}
  else if(k.indexOf("pulseira")>-1){
    b='<ellipse cx="100" cy="135" rx="72" ry="36" fill="none" '+G+' stroke-width="6"/>';
    for(i=0;i<14;i++){a=i/14*6.2832;b+='<circle cx="'+(100+72*Math.cos(a)).toFixed(1)+'" cy="'+(135+36*Math.sin(a)).toFixed(1)+'" r="5" fill="#f3ead7" fill-opacity=".85" '+G+' stroke-width="1.5"/>'}
    b+=star(160,70,9)}
  else if(k.indexOf("conjunto")>-1){
    for(i=0;i<=12;i++){t=i/12;x=(1-t)*(1-t)*30+2*(1-t)*t*100+t*t*170;y=(1-t)*(1-t)*50+2*(1-t)*t*200+t*t*50;b+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="#f3ead7" fill-opacity=".9" '+G+' stroke-width="1.5"/>'}
    [62,138].forEach(function(cx){b+='<circle cx="'+cx+'" cy="196" r="8" fill="#f3ead7" fill-opacity=".9" '+G+' stroke-width="1.5"/><path d="M'+cx+' 172V188" '+G+' stroke-width="2.5"/>'});
    b+=star(100,160,8)}
  else{
    b='<path d="M62 90L138 90L160 120L100 190L40 120Z" fill="#e6c97a" fill-opacity=".14" '+G+' stroke-width="3" stroke-linejoin="round"/><path d="M40 120H160M62 90L78 120L100 190L122 120L138 90M78 120L100 90L122 120" fill="none" '+G+' stroke-width="1.5"/>'+star(160,60,10)}
  return '<svg viewBox="0 0 200 250" role="img" aria-label="Ilustração de '+esc(c||"joia")+'">'+b+'</svg>'}

function art(p){return p.foto?'<img src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'" loading="lazy">':ART(p.cat)}
function price(p){return D.cfg.preco&&p.preco!=null?money(p.preco):""}
function ask(p){return p.off?wa("Olá! Gostaria de ser avisada quando chegar a peça: "+p.nome):wa("Olá! Tenho interesse na peça: "+p.nome+(price(p)?" ("+price(p)+")":""))}

function card(p){
  return '<article class="card reveal'+(p.off?' off':'')+'"><button class="ph" data-open="'+p.id+'" aria-label="Ver '+esc(p.nome)+'">'
   +(p.off?'<span class="badge off">Esgotado</span>':p.nova?'<span class="badge">Novidade</span>':'')+art(p)+'</button>'
   +'<h3 data-open="'+p.id+'">'+esc(p.nome)+'</h3><div class="cat">'+esc(p.cat)+'</div>'
   +(price(p)?'<div class="pr">'+price(p)+'</div>':'')
   +'<a class="ask" href="'+ask(p)+'" target="_blank" rel="noopener">'+(p.off?'Avise-me quando chegar':'Quero esta peça')+'</a></article>'}

var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1}):null;
function reveal(){document.querySelectorAll(".reveal:not(.in)").forEach(function(el){io?io.observe(el):el.classList.add("in")})}

function cats(){return ["Todas"].concat(D.pecas.map(function(p){return p.cat}).filter(function(c,i,a){return c&&a.indexOf(c)===i}))}
function renderAll(){
  var t=$("q").value.toLowerCase();
  var l=D.pecas.filter(function(p){return (cur==="Todas"||p.cat===cur)&&p.nome.toLowerCase().indexOf(t)>-1});
  $("todas").innerHTML=l.length?l.map(card).join(""):'<p class="empty">Nenhuma peça encontrada. Tente outra categoria ou palavra.</p>';
  reveal();
}
function chips(){
  var cs=cats();if(cs.indexOf(cur)<0)cur="Todas";
  $("chips").innerHTML=cs.map(function(k){return '<button class="chip" aria-pressed="'+(k===cur)+'" data-c="'+esc(k)+'">'+esc(k)+'</button>'}).join("");
}
function render(){
  var n=D.pecas.filter(function(p){return p.nova});
  $("novas").innerHTML=n.map(card).join("");
  $("novidades").style.display=n.length?"":"none";
  document.querySelector('nav a[href="#novidades"]').style.display=n.length?"":"none";
  chips();renderAll();
  $("sobreTxt").textContent=D.cfg.sobre;
  $("hor").textContent=D.cfg.horario;
  ["wl","wf"].forEach(function(i){$(i).href=wa("Olá! Vim pelo site da Van Joias.")});
  $("il").href="https://instagram.com/"+D.cfg.insta;$("il").textContent="@"+D.cfg.insta;
}

/* Eventos do site */
$("chips").onclick=function(e){var k=e.target.getAttribute("data-c");if(k){cur=k;chips();renderAll()}};
$("q").oninput=renderAll;
document.addEventListener("click",function(e){var o=e.target.closest("[data-open]");if(o)openP(+o.getAttribute("data-open"))});

/* Janela da peça */
function openP(id){
  var p=D.pecas.filter(function(q){return q.id===id})[0];if(!p)return;
  var d=$("pm");
  d.innerHTML='<button class="x" aria-label="Fechar" data-close>&times;</button><div class="pm"><div class="big">'+art(p)+'</div><div class="info"><div class="cat" style="color:var(--mute)">'+esc(p.cat)+'</div><h3>'+esc(p.nome)+'</h3>'
   +(price(p)?'<div class="pr">'+price(p)+'</div>':'')+(p.off?'<p style="color:var(--mute);margin:0">Peça esgotada no momento.</p>':'')
   +'<div><a class="btn" href="'+ask(p)+'" target="_blank" rel="noopener">'+(p.off?'Avise-me quando chegar':'Quero esta peça')+'</a></div></div></div>';

}
document.addEventListener("click",function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute("data-close"))e.target.closest("dialog").close();
  if(e.target.tagName==="DIALOG")e.target.close();
});

/* Cabeçalho interativo */
var hd=document.querySelector("header"),secs=["inicio","novidades","catalogo","sobre","contato"],tk=false;
function onScroll(){
  var y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  hd.classList.toggle("min",y>60);
  $("prog").style.width=(h>0?y/h*100:0)+"%";
  var cs="inicio";secs.forEach(function(s){var el=$(s);if(el&&el.offsetParent!==null&&el.getBoundingClientRect().top<innerHeight*.35)cs=s});
  document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+cs)});
  tk=false;
}
addEventListener("scroll",function(){if(!tk){tk=true;requestAnimationFrame(onScroll)}},{passive:true});
$("mb").onclick=function(){var o=$("nv").classList.toggle("open");this.setAttribute("aria-expanded",o)};
$("nv").onclick=function(e){if(e.target.tagName==="A"){$("nv").classList.remove("open");$("mb").setAttribute("aria-expanded","false")}};

/* Palavras que alternam no título */
(function(){
  var w=["presentear","celebrar","brilhar","encantar","todo dia"],i=0,e=$("rot");
  if(RM)return;
  setInterval(function(){e.classList.add("out");setTimeout(function(){i=(i+1)%w.length;e.textContent=w[i];e.classList.remove("out")},400)},2800);

/* Brilhos que reagem ao mouse/toque */
(function(){
  var cv=$("sp"),x=cv.getContext("2d"),W,H,P=[],m={x:-999,y:-999},run=true,box=cv.parentNode;
  function size(){var r=box.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
    P=[];var n=Math.min(70,Math.round(W*H/14000));for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,a:Math.random()*6.28,s:.6+Math.random()*1.4,vx:0,vy:0})}
  function draw(t){
    x.clearRect(0,0,W,H);
    P.forEach(function(p){
      var dx=p.x-m.x,dy=p.y-m.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130&&d>0){var f=(130-d)/130*1.6;p.vx+=dx/d*f;p.vy+=dy/d*f}
      p.vx*=.92;p.vy*=.92;p.x+=p.vx;p.y+=p.vy-.08;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      var o=RM?.7:.25+.75*(.5+.5*Math.sin(t/700*p.s+p.a)),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,"rgba(240,215,140,"+o+")");g.addColorStop(1,"rgba(201,162,75,0)");
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*5,0,6.2832);x.fill();
    });
  }
  function loop(t){if(run)draw(t);requestAnimationFrame(loop)}
  size();addEventListener("resize",size);
  box.addEventListener("pointermove",function(e){var r=box.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top;
    var a=$("ha").firstElementChild;a.style.transform="rotateY("+((m.x/W-.5)*26)+"deg) rotateX("+(-(m.y/H-.5)*20)+"deg)"});
  box.addEventListener("pointerleave",function(){m.x=m.y=-999;$("ha").firstElementChild.style.transform=""});
  if("IntersectionObserver" in window)new IntersectionObserver(function(es){run=es[0].isIntersecting}).observe(box);
  if(RM)draw(0);else requestAnimationFrame(loop);
})();

/* ===== Área da loja (administrador) ===== */
var AD=$("adm");
function authed(){try{return sessionStorage.getItem("vjadm")==="1"}catch(e){return false}}
function openAdm(){tab="p";admRender();AD.showModal()}
$("ob").onclick=openAdm;
if(location.hash==="#admin")setTimeout(openAdm,300);

function admRender(){
  if(!authed()){
    AD.innerHTML='<button class="x" aria-label="Fechar" data-close>&times;</button><div class="adm"><h3>Área da loja</h3><form id="lg" class="stack"><label>Senha<input type="password" id="pw" autocomplete="current-password"></label><div class="msg" id="lm"></div><div><button class="btn" type="submit">Entrar</button></div><p class="note">Senha inicial: <b>vanjoias123</b>. Troque na aba Configurações assim que entrar.</p></form></div>';
    $("lg").onsubmit=function(e){e.preventDefault();var v=$("pw").value,ok=D.cfg.pw?hash(v)===D.cfg.pw:v==="vanjoias123";
      if(ok){try{sessionStorage.setItem("vjadm","1")}catch(x){}admRender()}else $("lm").textContent="Senha incorreta."};
    setTimeout(function(){$("pw")&&$("pw").focus()},50);return;
  }
  var T=[["p","Peças"],["c","Configurações"],["b","Publicar e backup"]];
  var h='<button class="x" aria-label="Fechar" data-close>&times;</button><div class="adm"><h3>Área da loja</h3><div class="tabs">'
   +T.map(function(t){return '<button class="chip" data-tab="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  if(tab==="p"){
    h+='<div class="row"><button class="btn" data-act="add" type="button">+ Nova peça</button><span class="note">Mudanças são salvas na hora neste navegador. Para colocar no ar, use a aba Publicar e backup.</span></div>'
     +'<datalist id="cl">'+cats().filter(function(c){return c!=="Todas"}).map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist>';
    D.pecas.forEach(function(p){
      h+='<div class="ar" data-id="'+p.id+'"><div class="at">'+art(p)+'</div><div class="af">'
       +'<label>Nome<input type="text" data-k="nome" value="'+esc(p.nome)+'"></label>'
       +'<label>Categoria<input type="text" data-k="cat" list="cl" value="'+esc(p.cat)+'"></label>'
       +'<label>Preço (R$)<input type="text" inputmode="decimal" data-k="preco" value="'+(p.preco==null?"":String(p.preco.toFixed(2)).replace(".",","))+'" placeholder="vazio = sem preço"></label>'
       +'<div class="ab"><label class="sm" style="cursor:pointer">'+(p.foto?'Trocar foto':'Enviar foto')+'<input type="file" accept="image/*" data-photo hidden></label>'
       +(p.foto?'<button class="sm" type="button" data-act="nofoto">Tirar foto</button>':'')
       +'<label class="ck"><input type="checkbox" data-k="nova"'+(p.nova?' checked':'')+'> Novidade</label>'
       +'<label class="ck"><input type="checkbox" data-k="off"'+(p.off?' checked':'')+'> Esgotado</label>'
       +'<button class="sm dg" type="button" data-act="del">Excluir</button></div></div></div>';
    });
    if(!D.pecas.length)h+='<p class="note" style="margin-top:20px">Nenhuma peça cadastrada.</p>';
  }else if(tab==="c"){
    h+='<form class="stack" id="cf"><label>WhatsApp (com DDI e DDD, só números)<input type="text" id="c1" inputmode="numeric" value="'+esc(D.cfg.whats)+'"></label>'
     +'<label>Instagram (sem @)<input type="text" id="c2" value="'+esc(D.cfg.insta)+'"></label>'
     +'<label>Horário de atendimento<input type="text" id="c3" value="'+esc(D.cfg.horario)+'"></label>'
     +'<label>Texto da seção Sobre<textarea id="c4">'+esc(D.cfg.sobre)+'</textarea></label>'
     +'<label class="ck"><input type="checkbox" id="c5"'+(D.cfg.preco?' checked':'')+'> Mostrar preços no site</label>'
     +'<label>Nova senha da área da loja (deixe vazio para manter)<input type="password" id="c6" autocomplete="new-password"></label>'
     +'<div class="msg" id="cm" style="color:var(--gold2)"></div><div><button class="btn" type="submit">Salvar configurações</button></div></form>';
  }else{
    h+='<div class="stack"><p class="note"><b>Como funciona:</b> o que você muda aqui fica salvo só neste navegador. Para o site mudar para todo mundo, clique em <b>Baixar site atualizado</b> e coloque o arquivo baixado no lugar do arquivo atual da hospedagem.</p>'
     +'<div class="row"><button class="btn" data-act="html" type="button">Baixar site atualizado (.html)</button></div>'
     +'<p class="note">Backup só dos dados (peças, fotos e configurações), para guardar ou levar a outro computador:</p>'
     +'<div class="row"><button class="sm" data-act="json" type="button">Baixar backup (.json)</button><label class="sm" style="cursor:pointer">Importar backup<input type="file" accept=".json,application/json" data-imp hidden></label></div>'
     +'<div class="row"><button class="sm dg" data-act="reset" type="button">Restaurar peças originais</button><button class="sm" data-act="out" type="button">Sair da área da loja</button></div></div>';
  }
  AD.innerHTML=h+'</div>';
  if(tab==="c")$("cf").onsubmit=function(e){
    e.preventDefault();var w=$("c1").value.replace(/\D/g,"");
    if(w.length<10){$("cm").style.color="#e08a7a";$("cm").textContent="Confira o número do WhatsApp (com DDI e DDD).";return}
    D.cfg.whats=w;D.cfg.insta=$("c2").value.replace(/^@/,"").trim();D.cfg.horario=$("c3").value;D.cfg.sobre=$("c4").value;D.cfg.preco=$("c5").checked;
    var np=$("c6").value;if(np){if(np.length<6){$("cm").style.color="#e08a7a";$("cm").textContent="A senha precisa ter pelo menos 6 caracteres.";return}D.cfg.pw=hash(np);$("c6").value=""}
    save();$("cm").style.color="var(--gold2)";$("cm").textContent="Salvo.";
  };
}

AD.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){tab=t.getAttribute("data-tab");admRender();return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),row=b.closest(".ar"),id=row&&+row.getAttribute("data-id");
  if(a==="add"){D.pecas.unshift({id:Date.now(),nome:"Nova peça",cat:cats()[1]||"Anéis",preco:null,foto:"",nova:true,off:false});save();admRender()}
  else if(a==="del"){if(confirm("Excluir esta peça?")){D.pecas=D.pecas.filter(function(p){return p.id!==id});save();admRender()}}
  else if(a==="nofoto"){D.pecas.forEach(function(p){if(p.id===id)p.foto=""});save();admRender()}
  else if(a==="html")exportHtml();
  else if(a==="json")dl(JSON.stringify(D),"van-joias-backup.json","application/json");
  else if(a==="reset"){if(confirm("Apagar suas alterações e voltar às peças originais?")){try{localStorage.removeItem(KEY)}catch(x){}load();render();admRender()}}
  else if(a==="out"){try{sessionStorage.removeItem("vjadm")}catch(x){}AD.close()}
});
AD.addEventListener("change",function(e){
  var el=e.target,row=el.closest(".ar"),id=row&&+row.getAttribute("data-id");
  if(el.hasAttribute("data-photo")&&el.files[0]){
    shrink(el.files[0],function(url){D.pecas.forEach(function(p){if(p.id===id)p.foto=url});save();admRender()});return}
  if(el.hasAttribute("data-imp")&&el.files[0]){
    var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.pecas||!j.cfg)throw 0;j.rev=SEED.rev;D=j;save();admRender();alert("Backup importado.")}catch(x){alert("Arquivo de backup inválido.")}};r.readAsText(el.files[0]);return}
  var k=el.getAttribute("data-k");if(!k||!row)return;
  D.pecas.forEach(function(p){if(p.id!==id)return;
    if(k==="preco")p.preco=parseP(el.value);else if(k==="nova"||k==="off")p[k]=el.checked;else p[k]=el.value.trim()||p[k]});
  save();
  if(k==="preco"){var p2=D.pecas.filter(function(p){return p.id===id})[0];el.value=p2.preco==null?"":p2.preco.toFixed(2).replace(".",",")}
});

function shrink(file,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var M=900,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    var g=c.getContext("2d");g.fillStyle="#000";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.8))};im.onerror=function(){alert("Não consegui abrir essa imagem.")};im.src=r.result};r.readAsDataURL(file);
}
function dl(txt,name,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportHtml(){
  var seed=JSON.parse(JSON.stringify(D));seed.rev=Date.now();
  var c=document.documentElement.cloneNode(true);
  ["novas","todas","chips"].forEach(function(i){c.querySelector("#"+i).innerHTML=""});
  ["adm","pm"].forEach(function(i){var e=c.querySelector("#"+i);e.innerHTML="";e.removeAttribute("open")});
  c.querySelector("header").className="";c.querySelector("#prog").removeAttribute("style");c.querySelector("#nv").className="";
  c.querySelector("#novidades").removeAttribute("style");
  c.querySelectorAll("nav a").forEach(function(a){a.className="";a.removeAttribute("style")});
  c.querySelector("#seed").textContent=JSON.stringify(seed).replace(/</g,"\\u003c");
  dl("<!DOCTYPE html>\n"+c.outerHTML,"Van Joias.html","text/html");
}

load();render();onScroll();
</script>
